name: Ejercicio4
on:
  workflow_dispatch:
jobs:
  job1:
    name: "Genero un archivo .txt"
    runs-on: ubuntu-latest
    steps:
    - run: echo "Creo un archivo .txt"
    - uses: actions/checkout@v3
    - run: nano ./.github/workflows/ejercicio4.txt holaaaa
      name: Creo un archivo .txt
  job2:
    name: "Muestro el contenido del archivo .txt"
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo "Muestro el contenido del archivo .txt"
      - uses: actions/checkout@v3
      - run: cat ./.github/workflows/ejercicio4.txt
        name: display content of ejercicio4.txt







  say_hello:
    name: "Let's greet the users!"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, there!"
      - uses: actions/checkout@v3
      - run: cat ./.github/workflows/list.txt
        name: display content of list.txt
      - run: echo "I am step 4!"