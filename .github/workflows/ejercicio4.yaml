name: Ejercicio_4
on:
  workflow_dispatch:
jobs:
  job1:
    name: "Genero un archivo .txt"
    runs-on: ubuntu-latest
    steps:
    - run: echo "Creo un archivo .txt" > ejercicio4.txt
    - uses: actions/checkout@v3
  job2:
    name: "Muestro el contenido del archivo .txt"
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo "Muestro el contenido del archivo .txt"
      - uses: actions/checkout@v3
      - run: cat ./.github/workflows/ejercicio4.txt
        name: display content of ejercicio4.txt