# 3. Matriz de Estrategia: Ejecuta un mismo job 
# de "Test" simultáneamente en tres versiones 
# diferentes de Python (3.11 y 3.12).
name: Ejercicio_3
on:
  workflow_dispatch:
jobs:
  test-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ejecutar pruebas
        run: |
          python --version
          echo "Ejecutando pruebas en Python ${{ matrix.python-version }}"