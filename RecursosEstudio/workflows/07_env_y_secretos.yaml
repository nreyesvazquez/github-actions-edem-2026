# =====================================================================
# 07 · VARIABLES DE ENTORNO Y SECRETOS     (diapositiva «Gestión: Configuración Dinámica»)
# ---------------------------------------------------------------------
# env:      valores reutilizables (nombre de la base de datos, usuario...).
#           Se definen a tres niveles; el más concreto gana:
#             workflow  ->  todos los jobs
#             job       ->  todos los steps de ese job
#             step      ->  solo ese step
# secrets:  datos sensibles que NUNCA van en el código (contraseñas, claves).
#           GitHub los enmascara en el log: salen como ***
# vars:     variables de configuración que no son secretas (región, URL...).
#
# ANTES DE PROBARLO, crea el secreto (si no, el login simulado solo avisa):
#   GitHub > tu repositorio > Settings > Secrets and variables > Actions >
#   New repository secret.  Name: DB_PASSWORD   Secret: lo que quieras.
# Opcional, en la pestaña Variables de esa misma página: REGION = europe-southwest1
#
# CÓMO PROBARLO: cópialo a .github/workflows/, push, Actions > Run workflow.
# =====================================================================
name: "07 · Variables de entorno y secretos"

on:
  workflow_dispatch:

# Nivel workflow: las ven todos los jobs
env:
  GLOBAL_USER: "estudiante_edem"
  BBDD_NOMBRE: "peliculas"

jobs:
  job_1:
    runs-on: ubuntu-latest
    # Nivel job: solo dentro de job_1
    env:
      ENTORNO: "desarrollo"
    steps:
      # Como en la presentación: $GLOBAL_USER la lee la terminal
      - run: echo "El usuario en Job 1 es $GLOBAL_USER"

      - name: Variables a tres niveles
        # Nivel step: solo en este step, y pisa al BBDD_NOMBRE del workflow
        env:
          BBDD_NOMBRE: "peliculas_test"
        run: |
          echo "Usuario:       $GLOBAL_USER   (del workflow)"
          echo "Entorno:       $ENTORNO       (del job)"
          echo "Base de datos: $BBDD_NOMBRE   (del step: pisa al del workflow)"

      # run: | aunque sea una línea: el texto lleva «: », y en una sola línea YAML
      # lo confundiría con una clave (ver «Si algo falla» en el README)
      - name: En el step siguiente vuelve el valor del workflow
        run: |
          echo "Base de datos: $BBDD_NOMBRE"

      - name: Dos formas de leer una variable
        run: |
          echo "Con la terminal:     $GLOBAL_USER"
          echo "Con el contexto env: ${{ env.GLOBAL_USER }}"

      # Escribir NOMBRE=valor en $GITHUB_ENV crea una variable para los steps
      # SIGUIENTES de este job (en el mismo step todavía no existe)
      - name: Crear una variable durante la ejecución
        run: echo "VERSION_APP=1.4.2" >> "$GITHUB_ENV"

      - run: |
          echo "Versión creada en el step anterior: $VERSION_APP"

  job_2:
    runs-on: ubuntu-latest
    steps:
      - name: Lo que ve otro job
        run: |
          echo "El usuario en Job 2 es $GLOBAL_USER"
          echo "ENTORNO aquí no existe: '${ENTORNO:-}'  (era solo de job_1)"
          echo "VERSION_APP tampoco: '${VERSION_APP:-}'  (GITHUB_ENV solo vale dentro de su job)"

  login_simulado:
    runs-on: ubuntu-latest
    steps:
      # El secreto entra por env, y el script usa la variable. Es mejor que poner
      # ${{ secrets.DB_PASSWORD }} dentro del comando, como en la presentación.
      - name: Login con un secreto
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::warning::No existe el secreto DB_PASSWORD. Créalo en Settings > Secrets and variables > Actions"
            exit 0
          fi
          # Aunque lo imprimas, GitHub lo tapa: en el log sale ***
          echo "Contraseña recibida: $DB_PASSWORD"
          echo "login --user $GLOBAL_USER --pass ****  ->  conectado (simulado)"

      # ::add-mask:: tapa en el log un valor que no es un secreto de GitHub
      # (por ejemplo, un token que se genera durante la ejecución)
      - name: Enmascarar un valor generado en la ejecución
        run: |
          token_temporal="tmp-$(date +%s)"
          echo "::add-mask::$token_temporal"
          echo "Token temporal: $token_temporal"

      # vars: variables de configuración, NO secretas (se ven en el log)
      - name: Una variable de configuración
        run: |
          echo "Región: ${{ vars.REGION || 'no definida (créala en la pestaña Variables)' }}"
